map $http_upgrade $cms_connection_upgrade { default upgrade; "" close; }
server {
 listen 127.0.0.1:18448 ssl proxy_protocol;
 server_name cms.paulislava.space;
 set_real_ip_from 127.0.0.1;
 real_ip_header proxy_protocol;
 ssl_certificate /etc/letsencrypt/live/cms.paulislava.space/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/cms.paulislava.space/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 100m;
 location / {
  proxy_pass http://127.0.0.1:24005;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $cms_connection_upgrade;
  proxy_read_timeout 120s;
 }
}
