server {
 listen 127.0.0.1:18450 ssl proxy_protocol;
 server_name cdn.paulislava.space;
 set_real_ip_from 127.0.0.1;
 real_ip_header proxy_protocol;
 ssl_certificate /etc/letsencrypt/live/cdn.paulislava.space/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/cdn.paulislava.space/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 100m;
 location ^~ /minio/admin/ { return 403; }
 location / {
  proxy_pass http://127.0.0.1:24007;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Connection "";
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
 }
}
