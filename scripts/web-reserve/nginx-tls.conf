server {
 listen 127.0.0.1:18451 ssl proxy_protocol;
 server_name paulislava.space;
 set_real_ip_from 127.0.0.1;
 real_ip_header proxy_protocol;
 ssl_certificate /etc/letsencrypt/live/paulislava.space/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/paulislava.space/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 10m;
 location = /proff { return 308 /proff/; }
 location ^~ /proff/ {
  proxy_pass http://127.0.0.1:24009;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  client_max_body_size 100m;
  proxy_read_timeout 120s;
 }
 location = /_next/image {
  proxy_pass http://127.0.0.1:24008;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Accept "";
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 120s;
 }
 location / {
  proxy_pass http://127.0.0.1:24008;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 120s;
 }
}
